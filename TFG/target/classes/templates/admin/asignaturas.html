<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asignaturas · Easy4You Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Easy4You · Admin</div>
      <nav class="menu">
        <a th:href="@{/admin}" th:classappend="${nav == 'dashboard'} ? ' active' : ''">Dashboard</a>
        <a th:href="@{/admin/usuarios}" th:classappend="${nav == 'usuarios'} ? ' active' : ''">Usuarios</a>
        <a th:href="@{/admin/asignaturas}" th:classappend="${nav == 'asignaturas'} ? ' active' : ''">Asignaturas</a>
        <form th:action="@{/logout}" method="post" class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="link-btn">Salir</button>
        </form>
      </nav>
    </header>

    <main class="container">
      <h1>Asignaturas</h1>

      <div th:if="${ok}" class="alert success" th:text="${ok}">OK</div>
      <div th:if="${error}" class="alert error" th:text="${error}">Error</div>

      <div th:if="${detalleAsignatura}" class="card detail">
        <div class="detail-head">
          <div>
            <div class="muted">Detalle de asignatura</div>
            <div class="detail-title" th:text="${detalleAsignatura.nombre}">Asignatura</div>
          </div>
          <a class="btn" th:href="@{/admin/asignaturas}">Cerrar</a>
        </div>

        <div class="detail-grid">
          <div>
            <div class="label">ID</div>
            <div th:text="${detalleAsignatura.id}">0</div>
          </div>
          <div>
            <div class="label">Descripción</div>
            <div th:text="${detalleAsignatura.descripcion}">-</div>
          </div>
          <div>
            <div class="label">Color</div>
            <div th:text="${detalleAsignatura.colorHex}">-</div>
          </div>
          <div>
            <div class="label">Creado</div>
            <div th:text="${detalleAsignatura.createdAt}">-</div>
          </div>
          <div>
            <div class="label">Actualizado</div>
            <div th:text="${detalleAsignatura.updatedAt}">-</div>
          </div>
        </div>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th class="actions">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="a : ${asignaturas}">
            <td th:text="${a.id}">1</td>
            <td th:text="${a.nombre}">Asignatura</td>
            <td th:text="${a.descripcion}">Descripción</td>
            <td class="actions">
              <a class="btn" th:href="@{/admin/asignaturas/{id}(id=${a.id})}">Ver</a>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
