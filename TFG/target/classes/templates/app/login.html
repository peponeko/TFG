<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso · Easy4You</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                400: "#7C5CFF",
                500: "#6D4CFF",
                600: "#5B3FFF",
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script th:src="@{/js/app.js}" defer></script>
  </head>

  <body data-page="login" class="min-h-screen bg-slate-950 text-slate-100">
    <main class="min-h-screen flex items-center justify-center p-6">
      <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/40 shadow-xl">
        <div class="p-8">
          <div class="mb-6">
            <h1 class="text-2xl font-semibold tracking-tight">Easy4You</h1>
            <p class="mt-1 text-sm text-slate-400">Accede para usar tu notebook.</p>
          </div>

          <form id="login-form" class="space-y-4">
            <div>
              <label for="login-email" class="block text-sm font-medium text-slate-300">Email</label>
              <input
                id="login-email"
                name="email"
                type="email"
                required
                autocomplete="email"
                placeholder="tu@email.com"
                class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950/40 px-3 py-2 text-sm outline-none ring-0 focus:border-brand-500"
              />
            </div>
            <div>
              <label for="login-password" class="block text-sm font-medium text-slate-300">Contraseña</label>
              <input
                id="login-password"
                name="password"
                type="password"
                required
                autocomplete="current-password"
                placeholder="••••••••"
                class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950/40 px-3 py-2 text-sm outline-none ring-0 focus:border-brand-500"
              />
            </div>

            <button
              type="submit"
              class="w-full rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-500"
            >
              Entrar
            </button>
          </form>

          <div class="mt-7 border-t border-slate-800 pt-6">
            <h2 class="text-sm font-semibold text-slate-300">¿No tienes cuenta?</h2>
            <p class="mt-1 text-xs text-slate-400">
              Crea una cuenta local para probar el flujo completo.
            </p>

            <form id="register-form" class="mt-4 space-y-3">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label for="reg-nombre" class="block text-xs font-medium text-slate-400">Nombre</label>
                  <input
                    id="reg-nombre"
                    name="nombre"
                    type="text"
                    required
                    placeholder="Pedro"
                    class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950/40 px-3 py-2 text-sm outline-none focus:border-brand-500"
                  />
                </div>
                <div>
                  <label for="reg-apellidos" class="block text-xs font-medium text-slate-400">Apellidos</label>
                  <input
                    id="reg-apellidos"
                    name="apellidos"
                    type="text"
                    required
                    placeholder="García"
                    class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950/40 px-3 py-2 text-sm outline-none focus:border-brand-500"
                  />
                </div>
              </div>

              <div>
                <label for="reg-email" class="block text-xs font-medium text-slate-400">Email</label>
                <input
                  id="reg-email"
                  name="email"
                  type="email"
                  required
                  autocomplete="email"
                  placeholder="tu@email.com"
                  class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950/40 px-3 py-2 text-sm outline-none focus:border-brand-500"
                />
              </div>

              <div>
                <label for="reg-password" class="block text-xs font-medium text-slate-400">Contraseña</label>
                <input
                  id="reg-password"
                  name="password"
                  type="password"
                  required
                  autocomplete="new-password"
                  placeholder="Mínimo 6 caracteres"
                  class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950/40 px-3 py-2 text-sm outline-none focus:border-brand-500"
                />
              </div>

              <button
                type="submit"
                class="w-full rounded-xl border border-slate-700 bg-slate-950/30 px-4 py-2.5 text-sm font-semibold text-slate-200 hover:border-brand-500"
              >
                Crear cuenta
              </button>
            </form>
          </div>

          <p class="mt-6 text-xs text-slate-500">
            Consejo: si usas Ollama, arráncalo en <span class="font-mono">http://localhost:11434</span>.
          </p>
        </div>
      </div>
    </main>

    <div id="toast-root"></div>
  </body>
</html>
