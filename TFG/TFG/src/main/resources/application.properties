# =============================================
#  Easy4You - Configuración principal
# =============================================

# --- Servidor ---
server.port=8082
spring.application.name=easy4you

# --- Base de datos (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/easy4you_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Europe/Madrid
# Nota: valores por defecto para desarrollo local. En servidor, usar variables de entorno.
spring.datasource.username=${DB_USER:easy4you_user}
spring.datasource.password=${DB_PASSWORD:easy4you_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Flyway ---
# Se habilita con baseline para no romper BBDD existentes ya creadas con ddl-auto=update.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# En producción, configurar por variable de entorno (JWT_SECRET) y no dejarlo hardcodeado.
#
# Valor por defecto SOLO para desarrollo local: una clave Base64 (>= 32 bytes tras decodificar).
# En servidor/producción, define JWT_SECRET y este valor no se usará.
app.jwt.secret=${JWT_SECRET:ZWQ0eV9kZXZfand0X3NlY3JldF9sb2NhbF9vbmx5X2RvX25vdF91c2VfaW5fcHJvZA==}
app.jwt.expiration-minutes=60

# --- Bootstrap (desactivado por defecto) ---
# Si necesitas crear un admin inicial en local:
# app.bootstrap.enabled=true
# app.bootstrap.admin.email=admin@easy4you.com
# app.bootstrap.admin.password=pon_una_password_segura

# --- Subida de ficheros ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Ruta base de almacenamiento de ficheros (NotebookLM)
app.storage.base-path=./uploads
app.storage.max-file-size=50MB
app.storage.max-zip-size=200MB

# (legacy) propiedad antigua de subida (no usar en nuevas features)
app.upload.dir=uploads

# --- Proveedor externo (opcional) ---
# Si no se configura, la aplicación usa un modo limitado.
ai.provider=openai
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=gpt-4o
ai.max-tokens-resumen=1000
ai.max-tokens-chat=2000
ai.max-tokens-flashcards=4096

# --- Thymeleaf (panel admin) ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- Logging ---
logging.level.com.easy4you=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.easy4you.service.ai=WARN

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Madrid
