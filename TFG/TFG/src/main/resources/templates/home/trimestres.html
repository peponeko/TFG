<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta property="og:title" content="Trimestres · Easy4You" />
    <title>Trimestres · Easy4You</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script th:src="@{/js/app.js}" defer></script>
  </head>

  <body
    data-page="home-trimestres"
    th:attr="data-asignatura-id=${asignaturaId}"
    class="apple-shell"
  >
    <header class="apple-header">
      <div class="apple-header-inner">
        <div style="display: flex; align-items: center; gap: 10px;">
          <button
            type="button"
            class="apple-back-btn"
            onclick="if (history.length > 1) history.back(); else window.location.href='/app/home';"
            aria-label="Atrás"
          >
            <span class="apple-back-icon">←</span><span>Atrás</span>
          </button>
          <a href="/app/home" class="apple-logo">Easy4You</a>
        </div>
        <nav class="apple-nav">
          <a href="/app/notas" class="apple-nav-link">Notas</a>
          <button id="logout-btn" class="apple-logout-btn">Salir</button>
        </nav>
      </div>
    </header>

    <main class="apple-container">
      <div class="apple-breadcrumb" id="breadcrumb">
        <a href="/app/home">Inicio</a> <span aria-hidden="true">›</span> <span id="breadcrumb-asignatura">—</span>
      </div>

      <h1 class="apple-section-title" style="margin-top: 10px;">
        <span id="asignatura-dot" class="apple-accent-dot"></span>
        <span id="asignatura-title">Cargando…</span>
      </h1>
      <p class="apple-hero-subtitle" style="margin-top: 8px; font-size: 16px;">Selecciona un trimestre</p>

      <div id="trimestres-grid" class="trimestres-grid"></div>
    </main>

    <button id="fab-add" class="apple-fab" aria-label="Crear tema">+</button>

    <div id="modal-root" class="hidden"></div>
    <div id="toast-root"></div>
  </body>
</html>
