<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · Easy4You Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <style>
      .login-container {
        max-width: 400px;
        margin: 80px auto;
        padding: 32px;
      }
      .login-form .form-group {
        margin-bottom: 16px;
      }
      .login-form label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: var(--muted);
      }
      .login-form input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
      }
      .login-form button {
        width: 100%;
        padding: 12px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
      }
      .login-form button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="container login-container">
      <h1 style="text-align: center; margin-bottom: 8px;">Easy4You · Admin</h1>
      <p class="muted" style="text-align: center; margin-bottom: 24px;">Panel de administración</p>

      <div th:if="${param.error}" class="alert error" style="margin-bottom: 20px;">
        Credenciales incorrectas. Verifica tu email y contraseña.
      </div>
      <div th:if="${ok}" class="alert success" style="margin-bottom: 20px;" th:text="${ok}"></div>

      <div class="card">
        <form th:action="@{/login}" method="post" class="login-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="form-group">
            <label for="username">Email</label>
            <input type="text" id="username" name="username" required autofocus placeholder="admin@easy4you.com" />
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required placeholder="••••••••" />
          </div>
          <button type="submit">Entrar</button>
        </form>
      </div>
    </main>
  </body>
</html>
