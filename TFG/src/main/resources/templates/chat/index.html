<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat · Easy4You</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                400: "#7C5CFF",
                500: "#6D4CFF",
                600: "#5B3FFF",
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script th:src="@{/js/app.js}" defer></script>
  </head>

  <body data-page="chat" class="min-h-screen bg-slate-950 text-slate-100">
    <header class="border-b border-slate-800 bg-slate-950/60 backdrop-blur">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
        <a href="/app/notebooks" class="flex items-center gap-2 font-semibold tracking-tight">
          <span class="inline-flex h-7 w-7 items-center justify-center rounded-lg bg-brand-600/20 text-brand-400"
            >E</span
          >
          <span>Easy4You</span>
        </a>
        <nav class="flex items-center gap-2">
          <a href="/app/notebooks" class="rounded-xl px-3 py-2 text-sm text-slate-300 hover:bg-slate-900/60"
            >Notebooks</a
          >
          <button
            id="logout-btn"
            class="rounded-xl border border-slate-800 bg-slate-950/30 px-3 py-2 text-sm font-medium text-slate-200 hover:border-brand-500"
          >
            Salir
          </button>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-6">
      <div class="grid grid-cols-1 gap-4 lg:grid-cols-[320px_1fr]">
        <aside class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-semibold">Conversaciones</h2>
            <button
              id="new-conversation-btn"
              class="rounded-xl border border-slate-800 bg-slate-950/20 px-3 py-2 text-xs font-medium text-slate-200 hover:border-brand-500"
            >
              Nueva
            </button>
          </div>
          <div id="conversation-list" class="mt-4 space-y-2"></div>
        </aside>

        <section class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4">
          <div id="chat-messages" class="h-[70vh] space-y-3 overflow-y-auto rounded-xl border border-slate-800 bg-slate-950/20 p-3"></div>
          <form id="chat-form" class="mt-3 flex gap-2">
            <input
              id="chat-input"
              type="text"
              placeholder="Escribe tu pregunta…"
              class="flex-1 rounded-xl border border-slate-800 bg-slate-950/20 px-3 py-2 text-sm text-slate-200 outline-none focus:border-brand-500"
            />
            <button
              type="submit"
              class="rounded-xl bg-brand-600 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-500"
            >
              Enviar
            </button>
          </form>
        </section>
      </div>
    </main>

    <div id="modal-root" class="hidden"></div>
    <div id="toast-root"></div>
  </body>
</html>
