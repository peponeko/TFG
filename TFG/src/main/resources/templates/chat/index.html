<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chat · Easy4You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script th:src="@{/js/app.js}" defer></script>
  </head>
  <body data-page="chat" class="apple-shell">
    <header class="apple-header">
      <div class="apple-header-inner">
        <div style="display:flex; align-items:center; gap:10px;">
          <button type="button" class="apple-back-btn" onclick="if (history.length > 1) history.back(); else window.location.href='/app/notebooks';" aria-label="Atrás">
            <span class="apple-back-icon">←</span><span>Atrás</span>
          </button>
          <a href="/app/home" class="apple-logo">Easy4You</a>
        </div>
        <nav class="apple-nav">
          <a href="/app/notebooks" class="apple-nav-link">Notebooks</a>
          <button id="logout-btn" class="apple-logout-btn">Salir</button>
        </nav>
      </div>
    </header>

    <main class="apple-container" style="padding-top: 18px;">
      <h1 class="apple-page-title">Chat con tus documentos</h1>
      <p class="apple-page-subtitle">Selecciona una conversación o crea una nueva.</p>

      <div class="apple-grid-2" style="margin-top: 18px;">
        <aside class="apple-panel">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 class="apple-panel-title">Conversaciones</h2>
            <button id="new-conversation-btn" class="apple-btn-secondary" style="padding:8px 12px; font-size:12px;">Nueva</button>
          </div>
          <div id="conversation-list" style="margin-top:14px; display:flex; flex-direction:column; gap:8px;"></div>
        </aside>

        <section class="apple-panel">
          <div id="chat-messages" class="apple-chat-window"></div>
          <form id="chat-form" style="margin-top: 12px; display: flex; gap: 8px;">
            <input id="chat-input" type="text" placeholder="Escribe tu pregunta…" class="apple-input" style="flex: 1;" />
            <button type="submit" class="apple-btn-primary">Enviar</button>
          </form>
        </section>
      </div>
    </main>

    <div id="modal-root" class="hidden"></div>
    <div id="toast-root"></div>
  </body>
</html>
