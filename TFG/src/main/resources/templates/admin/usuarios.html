<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios · Easy4You Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Easy4You · Admin</div>
      <nav class="menu">
        <a th:href="@{/admin}" th:classappend="${nav == 'dashboard'} ? ' active' : ''">Dashboard</a>
        <a th:href="@{/admin/usuarios}" th:classappend="${nav == 'usuarios'} ? ' active' : ''">Usuarios</a>
        <a th:href="@{/admin/asignaturas}" th:classappend="${nav == 'asignaturas'} ? ' active' : ''">Asignaturas</a>
        <form th:action="@{/logout}" method="post" class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="link-btn">Salir</button>
        </form>
      </nav>
    </header>

    <main class="container">
      <h1>Usuarios</h1>

      <div th:if="${ok}" class="alert success" th:text="${ok}">OK</div>
      <div th:if="${error}" class="alert error" th:text="${error}">Error</div>

      <div th:if="${detalleUsuario}" class="card detail">
        <div class="detail-head">
          <div>
            <div class="muted">Detalle de usuario</div>
            <div class="detail-title" th:text="${detalleUsuario.nombre + ' ' + detalleUsuario.apellidos}">Nombre</div>
          </div>
          <a class="btn" th:href="@{/admin/usuarios}">Cerrar</a>
        </div>

        <div class="detail-grid">
          <div>
            <div class="label">ID</div>
            <div th:text="${detalleUsuario.id}">0</div>
          </div>
          <div>
            <div class="label">Email</div>
            <div th:text="${detalleUsuario.email}">email</div>
          </div>
          <div>
            <div class="label">Activo</div>
            <div th:text="${detalleUsuario.activo}">true</div>
          </div>
          <div>
            <div class="label">Verificado</div>
            <div th:text="${detalleUsuario.verificado}">false</div>
          </div>
          <div>
            <div class="label">Creado</div>
            <div th:text="${detalleUsuario.createdAt}">-</div>
          </div>
          <div>
            <div class="label">Actualizado</div>
            <div th:text="${detalleUsuario.updatedAt}">-</div>
          </div>
        </div>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Activo</th>
            <th class="actions">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.nombre + ' ' + u.apellidos}">Nombre</td>
            <td th:text="${u.email}">email</td>
            <td>
              <span class="pill" th:classappend="${u.activo} ? ' ok' : ' off'" th:text="${u.activo} ? 'Sí' : 'No'"
                >Sí</span
              >
            </td>
            <td class="actions">
              <a class="btn" th:href="@{/admin/usuarios/{id}(id=${u.id})}">Ver</a>
              <form th:action="@{/admin/usuarios/{id}/eliminar(id=${u.id})}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="btn danger" type="submit" onclick="return confirm('¿Eliminar usuario?');">Eliminar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
