<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards · Easy4You</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                400: "#7C5CFF",
                500: "#6D4CFF",
                600: "#5B3FFF",
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script th:src="@{/js/app.js}" defer></script>
  </head>

  <body data-page="study-flashcards" class="min-h-screen bg-slate-950 text-slate-100">
    <header class="border-b border-slate-800 bg-slate-950/60 backdrop-blur">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
        <a href="/app/notebooks" class="flex items-center gap-2 font-semibold tracking-tight">
          <span class="inline-flex h-7 w-7 items-center justify-center rounded-lg bg-brand-600/20 text-brand-400"
            >E</span
          >
          <span>Easy4You</span>
        </a>
        <nav class="flex items-center gap-2">
          <a href="/app/notebooks" class="rounded-xl px-3 py-2 text-sm text-slate-300 hover:bg-slate-900/60"
            >Notebooks</a
          >
          <button
            id="logout-btn"
            class="rounded-xl border border-slate-800 bg-slate-950/30 px-3 py-2 text-sm font-medium text-slate-200 hover:border-brand-500"
          >
            Salir
          </button>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-10">
      <h1 class="text-2xl font-semibold tracking-tight">Sesión de flashcards</h1>
      <p class="mt-1 text-sm text-slate-400">
        Usa <span class="font-mono">?documentoId=</span> o <span class="font-mono">?temaId=</span> en la URL.
      </p>

      <div class="mt-8 rounded-2xl border border-slate-800 bg-slate-900/30 p-6">
        <div class="flex items-center justify-between">
          <p id="flashcard-counter" class="text-xs font-semibold uppercase tracking-wide text-slate-400">—</p>
          <button
            id="shuffle-btn"
            class="rounded-xl border border-slate-800 bg-slate-950/20 px-3 py-2 text-xs font-medium text-slate-200 hover:border-brand-500"
          >
            Mezclar
          </button>
        </div>

        <div id="flashcard-box" class="mt-5 rounded-2xl border border-slate-800 bg-slate-950/20 p-6">
          <p id="flashcard-question" class="text-lg font-semibold">—</p>
          <div id="flashcard-answer-box" class="mt-4 hidden">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Respuesta</p>
            <p id="flashcard-answer" class="mt-2 text-sm text-slate-200">—</p>
          </div>
        </div>

        <div class="mt-5 flex flex-col gap-2 sm:flex-row">
          <button
            id="toggle-answer-btn"
            class="flex-1 rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-500"
          >
            Ver respuesta
          </button>
          <button
            id="known-btn"
            class="flex-1 rounded-xl border border-slate-800 bg-slate-950/20 px-4 py-2.5 text-sm font-semibold text-slate-200 hover:border-brand-500"
          >
            La he repasado
          </button>
          <button
            id="next-btn"
            class="flex-1 rounded-xl border border-slate-800 bg-slate-950/20 px-4 py-2.5 text-sm font-semibold text-slate-200 hover:border-brand-500"
          >
            Siguiente
          </button>
        </div>

        <p id="study-empty" class="mt-6 hidden text-sm text-slate-500">
          No hay flashcards para este documento/tema. Genera flashcards desde la vista del documento.
        </p>
      </div>
    </main>

    <div id="toast-root"></div>
  </body>
</html>
