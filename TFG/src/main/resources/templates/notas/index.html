<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notas · Easy4You</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                400: "#7C5CFF",
                500: "#6D4CFF",
                600: "#5B3FFF",
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script th:src="@{/js/app.js}" defer></script>
  </head>

  <body data-page="notes" class="min-h-screen bg-slate-950 text-slate-100">
    <header class="border-b border-slate-800 bg-slate-950/60 backdrop-blur">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
        <a href="/app/notebooks" class="flex items-center gap-2 font-semibold tracking-tight">
          <span class="inline-flex h-7 w-7 items-center justify-center rounded-lg bg-brand-600/20 text-brand-400"
            >E</span
          >
          <span>Easy4You</span>
        </a>
        <nav class="flex items-center gap-2">
          <a href="/app/notebooks" class="rounded-xl px-3 py-2 text-sm text-slate-300 hover:bg-slate-900/60"
            >Notebooks</a
          >
          <button
            id="logout-btn"
            class="rounded-xl border border-slate-800 bg-slate-950/30 px-3 py-2 text-sm font-medium text-slate-200 hover:border-brand-500"
          >
            Salir
          </button>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-8">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">Notas</h1>
          <p class="mt-1 text-sm text-slate-400">Organiza tus ideas por documento, fragmento o tema.</p>
        </div>
      </div>

      <div class="mt-7 grid grid-cols-1 gap-4 lg:grid-cols-[380px_1fr]">
        <section class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4">
          <h2 class="text-sm font-semibold">Nueva nota</h2>
          <form id="create-note-form" class="mt-4 space-y-3">
            <div>
              <label for="note-title" class="block text-xs font-medium text-slate-400">Título</label>
              <input
                id="note-title"
                type="text"
                required
                class="mt-1.5 w-full rounded-xl border border-slate-800 bg-slate-950/20 px-3 py-2 text-sm text-slate-200 outline-none focus:border-brand-500"
                placeholder="Idea clave…"
              />
            </div>
            <div>
              <label for="note-content" class="block text-xs font-medium text-slate-400">Contenido</label>
              <textarea
                id="note-content"
                required
                rows="6"
                class="mt-1.5 w-full rounded-xl border border-slate-800 bg-slate-950/20 px-3 py-2 text-sm text-slate-200 outline-none focus:border-brand-500"
                placeholder="Escribe tu nota…"
              ></textarea>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="note-color" class="block text-xs font-medium text-slate-400">Color</label>
                <input
                  id="note-color"
                  type="color"
                  value="#6D4CFF"
                  class="mt-1.5 h-10 w-full rounded-xl border border-slate-800 bg-slate-950/20 px-2"
                />
              </div>
              <div>
                <label for="note-documento-id" class="block text-xs font-medium text-slate-400">Documento ID</label>
                <input
                  id="note-documento-id"
                  type="number"
                  class="mt-1.5 w-full rounded-xl border border-slate-800 bg-slate-950/20 px-3 py-2 text-sm text-slate-200 outline-none focus:border-brand-500"
                  placeholder="Opcional"
                />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="note-chunk-id" class="block text-xs font-medium text-slate-400">Chunk ID</label>
                <input
                  id="note-chunk-id"
                  type="number"
                  class="mt-1.5 w-full rounded-xl border border-slate-800 bg-slate-950/20 px-3 py-2 text-sm text-slate-200 outline-none focus:border-brand-500"
                  placeholder="Opcional"
                />
              </div>
              <div>
                <label for="note-tema-id" class="block text-xs font-medium text-slate-400">Tema ID</label>
                <input
                  id="note-tema-id"
                  type="number"
                  class="mt-1.5 w-full rounded-xl border border-slate-800 bg-slate-950/20 px-3 py-2 text-sm text-slate-200 outline-none focus:border-brand-500"
                  placeholder="Opcional"
                />
              </div>
            </div>

            <button
              type="submit"
              class="w-full rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-500"
            >
              Guardar nota
            </button>
          </form>
        </section>

        <section class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-semibold">Tus notas</h2>
            <button
              id="refresh-notes"
              class="rounded-xl border border-slate-800 bg-slate-950/20 px-3 py-2 text-xs font-medium text-slate-200 hover:border-brand-500"
            >
              Actualizar
            </button>
          </div>

          <div id="notes-grid" class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
          <p id="notes-empty" class="mt-6 hidden text-sm text-slate-500">
            No tienes notas todavía. Crea la primera desde el panel izquierdo.
          </p>
        </section>
      </div>
    </main>

    <div id="modal-root" class="hidden"></div>
    <div id="toast-root"></div>
  </body>
</html>
