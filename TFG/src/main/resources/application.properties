# =============================================
#  Easy4You - Configuración principal
# =============================================

# --- Servidor ---
server.port=8080
spring.application.name=easy4you

# --- Base de datos (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/easy4you_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Europe/Madrid
spring.datasource.username=easy4you_user
spring.datasource.password=easy4you_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
# Secreto en Base64 (mínimo 256 bits para HS256). Cámbialo en producción.
app.jwt.secret=ZWFzeTR5b3VfdGZnX3NlY3JldF9rZXlfbXVjaGFzX2dyYWNpYXNfMjAyNg==
app.jwt.expiration-minutes=60

# --- Subida de ficheros ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Ruta base de almacenamiento de ficheros (NotebookLM)
app.storage.base-path=./uploads
app.storage.max-file-size=50MB
app.storage.max-zip-size=200MB

# (legacy) propiedad antigua de subida (no usar en nuevas features)
app.upload.dir=uploads

# --- IA (NotebookLM) ---
ai.provider=gemini
ai.ollama.base-url=http://localhost:11434
ai.ollama.model=tinyllama
ai.gemini.api-key=AIzaSyBuUUY-QU1V0LuevqrCBWg3_Jb1XXAU12Y
ai.gemini.model=gemini-1.5-flash
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.model=llama3-8b-8192
ai.max-tokens-resumen=1000
ai.max-tokens-chat=2000
ai.max-tokens-flashcards=4096
ai.max-context-chunks=20

# --- Thymeleaf (panel admin) ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- Logging ---
logging.level.com.easy4you=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.easy4you.service.ai=DEBUG

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Madrid
